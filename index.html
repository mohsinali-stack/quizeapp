
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="style.css">
    <title>Quiz App</title>
</head>
<body>

    <h1>Quiz App</h1>
    <button onclick="quiz()">Start Quiz</button>
    <h2 id="result"></h2>

    <script>
        function quiz() {
            let score = 0;

            let question1 = prompt(
                "Q1: What is 5 + 5?\n1. 10\n2. 20\n3. 30"
            );

            if (question1 == 1) {
                score++;
            }

            let question2 = prompt(
                "Q2: Which language is used for web development?\n1. Python\n2. JavaScript\n3. C++"
            );

            if (question2 == 2) {
                score++;
            }

            let question3 = prompt(
                "Q3: Which keyword is used to declare a variable?\n1. let\n2. print\n3. output"
            );

            if (question3 == 1) {
                score++;
            }

            document.getElementById("result").innerText =
                "Quiz is complete! Your score is: " + score + "/3";
        }
    </script>

</body>
</html>
